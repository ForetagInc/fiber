#
# Fiber installer policy:
# - default to GPT + ext4
# - automated partitioning uses LUKS2
# - manual partitioning is disabled so unencrypted custom layouts are not offered

efi:
    mountPoint: "/boot/efi"
    recommendedSize: 300MiB
    minimumSize: 32MiB
    label: "EFI"

userSwapChoices:
    - file

luksGeneration: luks2
enableLuksAutomatedPartitioning: true
preCheckEncryption: true
allowManualPartitioning: false
showNotEncryptedBootMessage: true
initialPartitioningChoice: erase

defaultPartitionTableType: gpt
requiredPartitionTableType: gpt
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4"]

essentialMounts: [ "live-*", "control", "ventoy" ]

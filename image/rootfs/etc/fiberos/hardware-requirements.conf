# Fiber OS baseline hardware stack.
#
# The rootfs source used by scripts/build-rootfs should include:
# - Linux kernel modules for Intel/AMD/NVIDIA DRM graphics.
# - Linux firmware, including Wi-Fi, Bluetooth, GPU, and CPU microcode blobs.
# - udev/systemd for device discovery.
# - NetworkManager or iwd/wpa_supplicant for Wi-Fi.
# - BlueZ for Bluetooth.
# - PipeWire and WirePlumber for sound.
# - Mesa DRI drivers and Vulkan ICDs for GPU userspace.
#
# Run scripts/verify-rootfs-hardware --rootfs dist/rootfs/x86_64 --strict
# before release image creation.
